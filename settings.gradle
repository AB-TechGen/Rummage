pluginManagement {
    repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral(); gradlePluginPortal() }
    resolutionStrategy { eachPlugin { if (requested.id.id == 'net.fabricmc.fabric-loom') useModule("net.fabricmc:fabric-loom:${requested.version}") } }
}
rootProject.name = 'rummage'
