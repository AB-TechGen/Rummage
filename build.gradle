plugins { id 'net.fabricmc.fabric-loom' version '1.18.4' }
version = '0.2.1'
group = 'dev.rummage'
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.165.0+26.3'
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
jar { from('LICENSE'); from('licenses') { into 'META-INF/licenses' }; manifest { attributes 'Main-Class': 'dev.rummage.net.Synchronizer' } }
tasks.register('engineTest', JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = 'dev.rummage.EngineTest' }
tasks.named('test') {
    dependsOn engineTest
    // Assertions run through EngineTest.main; there are no JUnit/TestNG tests to discover.
    failOnNoDiscoveredTests = false
}
